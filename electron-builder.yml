appId: com.ankan17.joytokey
productName: JoyToKey
copyright: Copyright © 2026 Ankan

directories:
  buildResources: resources
  output: release

files:
  - out/**/*
  - "!**/*.map"
  - "!**/*.ts"

asar: true
asarUnpack:
  - node_modules/node-hid/**
  - node_modules/active-win/**

extraResources:
  - from: resources/cgkey.ps1
    to: cgkey.ps1

npmRebuild: true

win:
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64]
  icon: resources/icon.ico
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true

publish:
  provider: github
  owner: ankan17
  repo: electron-joytokey
  releaseType: release
