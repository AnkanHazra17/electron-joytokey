appId: com.yourorg.electron-joytokey
productName: JoyToKey
copyright: Copyright © 2026 Your Organisation
directories:
  buildResources: resources
  output: release

files:
  - out/**/*
  - "!**/*.map"
  - "!**/*.ts"

asar: true
asarUnpack:
  - node_modules/node-hid/**
  - node_modules/robotjs/**
  - node_modules/active-win/**
  - node_modules/@jitsi/**

npmRebuild: true

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.utilities
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  icon: resources/icon.icns

dmg:
  title: JoyToKey ${version}
  background: resources/dmg-background.png
  window:
    width: 540
    height: 380
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

publish:
  provider: github
  owner: your-org
  repo: electron-joytokey
  releaseType: release
